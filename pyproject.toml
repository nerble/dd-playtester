[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dd4tester"
version = "0.1.0"
description = "Async Telnet play-testing scaffold for Dragons Domain IV."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["keyring>=25"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dd4tester*"]

[tool.setuptools.package-data]
dd4tester = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "slow: marks long-running scenario or simulation tests",
]
